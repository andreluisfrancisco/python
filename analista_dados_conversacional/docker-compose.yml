name: analista-dados

# A API e o Streamlit usam a rede do host para alcançar o Postgres
# único da máquina, em 127.0.0.1:5432, database app.

services:
  api:
    build: .
    network_mode: host
    env_file: .env

  ui:
    build: .
    network_mode: host
    command: streamlit run client/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    depends_on:
      - api
